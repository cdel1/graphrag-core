name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Verify uv.lock is in sync with pyproject
        run: uv lock --check

      - name: Run unit tests
        run: uv run pytest tests/ -x -q

      - name: Boundary check — no domain leakage
        run: |
          FORBIDDEN="MonitoringTopic|Perspective|SubjectArea|Interview|Dalux|CapturePoint|InvestorAlert|SollIst"
          # Scan code AND published docs. CLAUDE.md / CHANGELOG.md are intentionally
          # excluded: they name these terms as policy (the forbidden list) and history.
          if grep -rn -E "$FORBIDDEN" src/ docs/ README.md; then
            echo "DOMAIN LEAKAGE DETECTED in graphrag-core"
            exit 1
          else
            echo "graphrag-core is clean"
          fi
