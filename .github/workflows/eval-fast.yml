name: eval-fast

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: eval-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - run: uv sync --frozen

      - name: Run Tier 1 invariant tests + eval framework tests
        # No LLM cost, and now by construction rather than by accident: the two
        # billable e2e tests carry `integration`, which conftest.py deselects
        # unless --run-integration / RUN_INTEGRATION=1. Previously they were
        # gated only on OPENAI_API_KEY being absent from this job — a missing
        # credential standing in for a decision (tessera#586).
        # -rs so a skip nobody intended is visible here.
        run: uv run pytest tests/eval/ -v -rs
