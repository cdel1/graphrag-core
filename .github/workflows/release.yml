name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify version matches tag
        # Single source of truth: src/graphrag_core/__init__.py (__version__).
        # pyproject.toml reads it dynamically (hatchling [tool.hatch.version]),
        # so pyproject and __init__ cannot drift. This gate only has to confirm
        # the pushed tag matches that one source — preventing the v0.6.0/v0.6.1
        # metadata-mismatch class of bug. See CHANGELOG v0.6.1 retrospective.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          INIT_VERSION=$(uv run python <<'PYEOF'
          src = open('src/graphrag_core/__init__.py').read()
          for line in src.splitlines():
              if line.startswith('__version__'):
                  rhs = line.split('=', 1)[1].strip()
                  print(rhs.strip('"').strip("'"))
                  break
          else:
              raise SystemExit('no __version__ found in src/graphrag_core/__init__.py')
          PYEOF
          )

          echo "Tag (sans 'v'):  $TAG"
          echo "__init__.py:     $INIT_VERSION"

          if [ "$TAG" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch — tag $TAG != __version__ $INIT_VERSION. Refusing to publish."
            echo "::error::Run scripts/bump-version.sh <version>, re-tag, re-push."
            exit 1
          fi
          echo "::notice::Tag matches __version__: $TAG"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
